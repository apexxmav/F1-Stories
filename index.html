<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexxMav F1 Stories - Formula 1 Race Coverage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: #e5e5e7;
            --accent: #ff1e3e;
            --accent-dark: #d61530;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #000000;
                --bg-secondary: #1d1d1f;
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --border-color: #424245;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navigation */
        nav {
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
            z-index: 100;
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .nav-brand {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--accent);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
            flex: 1;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        /* Hero Section */
        .hero {
            padding: 48px 0;
            margin-bottom: 48px;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
            align-items: stretch;
        }

        .hero-story {
            display: flex;
            flex-direction: column;
        }

        .hero-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, var(--accent), #ff4466);
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        .hero-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .hero-excerpt {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .hero-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .tag {
            display: inline-block;
            background-color: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .hero-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section {
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-secondary);
        }

        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .sidebar-item {
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-primary);
        }

        /* Sections */
        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .view-more {
            font-size: 14px;
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .view-more:hover {
            color: var(--accent-dark);
        }

        /* Stories Grid */
        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .story-card {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .story-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
        }

        .story-card-image {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, var(--accent), #ff4466);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
        }

        .story-card-content {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .story-card-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .story-card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .story-card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .story-card-tags .tag {
            padding: 4px 8px;
            font-size: 11px;
        }

        .story-card-excerpt {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: auto;
        }

        /* Compose Section */
        .compose-section {
            background-color: var(--bg-secondary);
            padding: 32px;
            border-radius: 12px;
            margin-bottom: 48px;
            border: 1px solid var(--border-color);
        }

        .compose-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 30, 62, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        input[type="file"] {
            font-size: 12px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: var(--accent-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--text-secondary);
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .filter-tab {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .filter-tab:hover,
        .filter-tab.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .hero-content {
                grid-template-columns: 1fr;
            }

            .hero-sidebar {
                display: none;
            }

            .hero-title {
                font-size: 24px;
            }

            .stories-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .compose-section {
                padding: 24px;
            }

            .filter-tabs {
                flex-wrap: wrap;
            }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-primary);
            padding: 32px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions button {
            flex: 1;
        }

        /* Story Detail Modal */
        .story-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-primary);
            z-index: 1000;
            overflow-y: auto;
        }

        .story-detail-modal.active {
            display: block;
        }

        .story-detail-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
            z-index: 101;
        }

        .story-detail-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .story-detail-close {
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            background: none;
            border: none;
            padding: 8px;
        }

        .story-detail-close:hover {
            color: var(--text-primary);
        }

        .story-detail-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .story-detail-image {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #ff4466);
            border-radius: 12px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            max-height: 600px;
            object-fit: contain;
        }

        .story-detail-image img {
            width: 100%;
            height: auto;
            max-height: 600px;
            object-fit: contain;
            border-radius: 12px;
        }

        .story-detail-meta {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .story-detail-title {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .story-detail-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .story-detail-text {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .story-detail-text p {
            margin-bottom: 20px;
        }

        .story-detail-results {
            background-color: var(--bg-secondary);
            padding: 24px;
            border-radius: 12px;
            margin-top: 32px;
            border: 1px solid var(--border-color);
        }

        .story-detail-results h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-position {
            font-weight: 600;
        }

        .result-gap {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Edit Modal */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1001;
            overflow-y: auto;
        }

        .edit-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-modal-content {
            background-color: var(--bg-primary);
            padding: 32px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .edit-modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <a href="#" class="nav-brand">ApexxMav F1 Stories</a>
            <ul class="nav-links">
                <li><a href="#" class="nav-link active" onclick="showSection('home')">Home</a></li>
                <li><a href="#" class="nav-link" onclick="showSection('stories')">All Stories</a></li>
                <li><a href="#" class="nav-link" onclick="showSection('by-driver')">By Driver</a></li>
                <li><a href="#" class="nav-link" onclick="showSection('by-race')">By Race</a></li>
                <li><a href="#" class="nav-link" onclick="showSection('archive')">Archive</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-secondary" style="padding: 8px 12px; font-size: 13px;" onclick="toggleTheme()">Theme</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Home Section -->
        <section id="home-section" class="section" style="display: block;">
            <!-- Compose Section -->
            <div class="compose-section">
                <div class="compose-title">Write New Story</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Story Title</label>
                        <input type="text" id="storyTitle" placeholder="Race recap, analysis...">
                    </div>
                    <div class="form-group">
                        <label>Race Date</label>
                        <input type="date" id="raceDate">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Driver</label>
                        <input type="text" id="driver" placeholder="e.g., Russell, Verstappen">
                    </div>
                    <div class="form-group">
                        <label>Race Location</label>
                        <input type="text" id="raceLocation" placeholder="e.g., Baku, Monaco">
                    </div>
                </div>
                <div class="form-group full">
                    <label>Story</label>
                    <textarea id="storyContent" placeholder="Write your F1 story..."></textarea>
                </div>
                <div class="form-group full">
                    <label>Add Image (Optional)</label>
                    <input type="file" id="storyImage" accept="image/*" onchange="previewImage()">
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="publishStory()">Publish Story</button>
                </div>
            </div>

            <!-- Featured Story -->
            <div id="featured-section" style="display: none; margin-bottom: 48px;">
                <div class="section-header">
                    <div class="section-title">Featured Story</div>
                </div>
                <div id="featured-story" class="hero-content"></div>
            </div>

            <!-- Latest Stories -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">Latest Stories</div>
                </div>
                <div id="latest-stories" class="stories-grid"></div>
            </div>
        </section>

        <!-- All Stories Section -->
        <section id="stories-section" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <div class="section-title">All Stories</div>
                </div>
                <input type="text" id="searchInput" placeholder="Search by driver, team, or race..." style="width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 24px; font-size: 14px;">
                <div id="all-stories" class="stories-grid"></div>
            </div>
        </section>

        <!-- By Driver Section -->
        <section id="driver-section" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <div class="section-title">Stories by Driver</div>
                </div>
                <div class="filter-tabs" id="driver-filters"></div>
                <div id="driver-stories" class="stories-grid"></div>
            </div>
        </section>

        <!-- By Race Section -->
        <section id="race-section" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <div class="section-title">Stories by Race</div>
                </div>
                <div class="filter-tabs" id="race-filters"></div>
                <div id="race-stories" class="stories-grid"></div>
            </div>
        </section>

        <!-- Archive Section -->
        <section id="archive-section" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <div class="section-title">Story Archive</div>
                </div>
                <div id="archive-stories" class="stories-grid"></div>
            </div>
        </section>
    </div>

    <!-- Edit Story Modal -->
    <div class="edit-modal" id="editModal">
        <div class="edit-modal-content">
            <div class="edit-modal-header">Edit Story</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Story Title</label>
                    <input type="text" id="editStoryTitle">
                </div>
                <div class="form-group">
                    <label>Race Date</label>
                    <input type="date" id="editRaceDate">
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Driver</label>
                    <input type="text" id="editDriver">
                </div>
                <div class="form-group">
                    <label>Race Location</label>
                    <input type="text" id="editRaceLocation">
                </div>
            </div>
            <div class="form-group full">
                <label>Story</label>
                <textarea id="editStoryContent"></textarea>
            </div>
            <div class="form-group full">
                <label>Add/Update Image</label>
                <input type="file" id="editStoryImage" accept="image/*" onchange="previewEditImage()">
                <img id="editImagePreview" style="max-width: 100%; height: auto; margin-top: 12px; border-radius: 8px; max-height: 200px; display: none;">
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="saveEditStory()">Save Changes</button>
                <button class="btn-secondary" onclick="closeEditModal()" style="flex: 0.5;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Story Detail Modal -->
    <div class="story-detail-modal" id="storyDetailModal">
        <div class="story-detail-header">
            <div class="container">
                <div class="section-title">Story</div>
                <button class="story-detail-close" onclick="closeStoryDetail()">✕</button>
            </div>
        </div>
        <div class="story-detail-content">
            <div id="storyDetailBody"></div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">Delete Story?</div>
            <div class="modal-description">This action cannot be undone.</div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn-primary" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let allStories = [];
        let deleteTargetId = null;
        let currentSection = 'home';
        let currentImageData = null;
        let editingStoryId = null;
        let editImageData = null;

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadStories();
            displayHome();
        });

        function publishStory() {
            const title = document.getElementById('storyTitle').value.trim();
            const content = document.getElementById('storyContent').value.trim();
            const driver = document.getElementById('driver').value.trim();
            const raceLocation = document.getElementById('raceLocation').value.trim();
            const raceDate = document.getElementById('raceDate').value;

            if (!title || !content) {
                alert('Please fill in title and story');
                return;
            }

            const story = {
                id: Date.now(),
                title,
                content,
                driver,
                raceLocation,
                raceDate,
                image: currentImageData,
                createdAt: new Date().toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                })
            };

            allStories.unshift(story);
            saveStories();
            displayHome();
            clearForm();
            currentImageData = null;
        }

        function previewImage() {
            const file = document.getElementById('storyImage').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentImageData = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function clearForm() {
            document.getElementById('storyTitle').value = '';
            document.getElementById('storyContent').value = '';
            document.getElementById('driver').value = '';
            document.getElementById('raceLocation').value = '';
            document.getElementById('raceDate').value = '';
            document.getElementById('storyImage').value = '';
            currentImageData = null;
        }

        function renderStoryCard(story) {
            return `
                <div class="story-card" onclick="openStoryDetail(${story.id})" style="cursor: pointer;">
                    <div class="story-card-image">${story.image ? `<img src="${story.image}" style="width: 100%; height: 100%; object-fit: cover;">` : '🏎️'}</div>
                    <div class="story-card-content">
                        <div class="story-card-meta">${story.createdAt}</div>
                        <div class="story-card-title">${escapeHtml(story.title)}</div>
                        <div class="story-card-tags">
                            ${story.driver ? `<span class="tag">${escapeHtml(story.driver)}</span>` : ''}
                            ${story.raceLocation ? `<span class="tag">${escapeHtml(story.raceLocation)}</span>` : ''}
                        </div>
                        <div class="story-card-excerpt">${escapeHtml(story.content).substring(0, 100)}...</div>
                        <div style="margin-top: 12px; display: flex; gap: 8px;">
                            <button class="btn-secondary" style="flex: 1; padding: 6px; font-size: 12px;" onclick="event.stopPropagation(); openEditModal(${story.id})">Edit</button>
                            <button class="btn-secondary" style="flex: 1; padding: 6px; font-size: 12px;" onclick="event.stopPropagation(); deleteStory(${story.id})">Delete</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHeroStory(story) {
            return `
                <div class="hero-story">
                    <div class="hero-image">${story.image ? `<img src="${story.image}" style="width: 100%; height: 100%; object-fit: cover;">` : '🏁'}</div>
                    <div class="hero-meta">
                        <span>${story.createdAt}</span>
                        ${story.raceDate ? `<span>${new Date(story.raceDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>` : ''}
                    </div>
                    <div class="hero-title">${escapeHtml(story.title)}</div>
                    <div class="hero-excerpt">${escapeHtml(story.content).substring(0, 150)}...</div>
                    <div class="hero-tags">
                        ${story.driver ? `<span class="tag">${escapeHtml(story.driver)}</span>` : ''}
                        ${story.raceLocation ? `<span class="tag">${escapeHtml(story.raceLocation)}</span>` : ''}
                    </div>
                </div>
            `;
        }

        function displayHome() {
            showSection('home');
            if (allStories.length > 0) {
                document.getElementById('featured-section').style.display = 'block';
                document.getElementById('featured-story').innerHTML = renderHeroStory(allStories[0]);
                document.getElementById('latest-stories').innerHTML = allStories.map(renderStoryCard).join('');
            } else {
                document.getElementById('featured-section').style.display = 'none';
                document.getElementById('latest-stories').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><p>No stories yet. Write your first F1 story above!</p></div>';
            }
        }

        function showSection(section) {
            document.querySelectorAll('section[id$="-section"]').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            
            if (section === 'home') {
                document.getElementById('home-section').style.display = 'block';
            } else if (section === 'stories') {
                document.getElementById('stories-section').style.display = 'block';
                document.getElementById('all-stories').innerHTML = allStories.length > 0 
                    ? allStories.map(renderStoryCard).join('') 
                    : '<div class="empty-state"><div class="empty-state-icon">📚</div><p>No stories yet</p></div>';
            } else if (section === 'by-driver') {
                document.getElementById('driver-section').style.display = 'block';
                displayByDriver();
            } else if (section === 'by-race') {
                document.getElementById('race-section').style.display = 'block';
                displayByRace();
            } else if (section === 'archive') {
                document.getElementById('archive-section').style.display = 'block';
                document.getElementById('archive-stories').innerHTML = allStories.reverse().map(renderStoryCard).join('');
                allStories.reverse();
            }
            
            currentSection = section;
        }

        function displayByDriver() {
            const drivers = [...new Set(allStories.map(s => s.driver).filter(Boolean))];
            const filtersHtml = drivers.map(d => `<button class="filter-tab" onclick="filterByDriver('${escapeHtml(d)}')">${escapeHtml(d)}</button>`).join('');
            document.getElementById('driver-filters').innerHTML = filtersHtml;
            document.getElementById('driver-stories').innerHTML = allStories.map(renderStoryCard).join('');
        }

        function filterByDriver(driver) {
            const filtered = allStories.filter(s => s.driver === driver);
            document.getElementById('driver-stories').innerHTML = filtered.map(renderStoryCard).join('');
        }

        function displayByRace() {
            const races = [...new Set(allStories.map(s => s.raceLocation).filter(Boolean))];
            const filtersHtml = races.map(r => `<button class="filter-tab" onclick="filterByRace('${escapeHtml(r)}')">${escapeHtml(r)}</button>`).join('');
            document.getElementById('race-filters').innerHTML = filtersHtml;
            document.getElementById('race-stories').innerHTML = allStories.map(renderStoryCard).join('');
        }

        function filterByRace(race) {
            const filtered = allStories.filter(s => s.raceLocation === race);
            document.getElementById('race-stories').innerHTML = filtered.map(renderStoryCard).join('');
        }

        document.getElementById('searchInput')?.addEventListener('keyup', function() {
            const search = this.value.toLowerCase();
            const filtered = allStories.filter(s => 
                s.title.toLowerCase().includes(search) ||
                s.driver.toLowerCase().includes(search) ||
                s.raceLocation.toLowerCase().includes(search) ||
                s.content.toLowerCase().includes(search)
            );
            document.getElementById('all-stories').innerHTML = filtered.map(renderStoryCard).join('');
        });

        function deleteStory(id) {
            deleteTargetId = id;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteTargetId = null;
        }

        function confirmDelete() {
            allStories = allStories.filter(s => s.id !== deleteTargetId);
            saveStories();
            displayHome();
            closeDeleteModal();
        }

        function saveStories() {
            localStorage.setItem('f1Stories', JSON.stringify(allStories));
        }

        function loadStories() {
            const stored = localStorage.getItem('f1Stories');
            allStories = stored ? JSON.parse(stored) : [];
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.style.colorScheme = 'light';
            } else {
                html.style.colorScheme = 'dark';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openStoryDetail(storyId) {
            const story = allStories.find(s => s.id === storyId);
            if (!story) return;

            const storyBody = document.getElementById('storyDetailBody');
            
            // Parse top 10 finishers if they exist in the content
            const topTenMatch = story.content.match(/TOP 10 FINISHERS:([\s\S]*?)$/);
            let mainContent = story.content;
            let topTen = null;

            if (topTenMatch) {
                mainContent = story.content.substring(0, topTenMatch.index).trim();
                topTen = topTenMatch[1].trim();
            }

            storyBody.innerHTML = `
                <div class="story-detail-image">${story.image ? `<img src="${story.image}" style="width: 100%; height: 100%; object-fit: cover;">` : '🏁'}</div>
                <div class="story-detail-meta">
                    <span>${story.createdAt}</span>
                    ${story.raceDate ? `<span>${new Date(story.raceDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>` : ''}
                </div>
                <h1 class="story-detail-title">${escapeHtml(story.title)}</h1>
                <div class="story-detail-tags">
                    ${story.driver ? `<span class="tag">${escapeHtml(story.driver)}</span>` : ''}
                    ${story.raceLocation ? `<span class="tag">${escapeHtml(story.raceLocation)}</span>` : ''}
                </div>
                <div class="story-detail-text">
                    ${mainContent.split('\n').map(para => para.trim()).filter(para => para).map(para => `<p>${escapeHtml(para)}</p>`).join('')}
                </div>
                ${topTen ? `
                    <div class="story-detail-results">
                        <h3>TOP 10 FINISHERS</h3>
                        <div class="results-list">
                            ${parseResults(topTen)}
                        </div>
                    </div>
                ` : ''}
            `;

            document.getElementById('storyDetailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function parseResults(resultsText) {
            const lines = resultsText.split('\n').filter(l => l.trim());
            return lines.map(line => {
                const match = line.match(/(\d+)\.\s+(.+?)\s+\((.+?)\)\s*(.*)/);
                if (match) {
                    const [, position, driver, team, gap] = match;
                    return `
                        <div class="result-item">
                            <div>
                                <span class="result-position">#${position}</span> ${escapeHtml(driver)} (${escapeHtml(team)})
                            </div>
                            ${gap ? `<span class="result-gap">${escapeHtml(gap)}</span>` : ''}
                        </div>
                    `;
                }
                return '';
            }).join('');
        }

        function closeStoryDetail() {
            document.getElementById('storyDetailModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeStoryDetail();
                closeEditModal();
            }
        });

        function openEditModal(storyId) {
            const story = allStories.find(s => s.id === storyId);
            if (!story) return;

            editingStoryId = storyId;
            editImageData = story.image;

            document.getElementById('editStoryTitle').value = story.title;
            document.getElementById('editRaceDate').value = story.raceDate;
            document.getElementById('editDriver').value = story.driver;
            document.getElementById('editRaceLocation').value = story.raceLocation;
            document.getElementById('editStoryContent').value = story.content;

            if (story.image) {
                document.getElementById('editImagePreview').src = story.image;
                document.getElementById('editImagePreview').style.display = 'block';
            } else {
                document.getElementById('editImagePreview').style.display = 'none';
            }

            document.getElementById('editStoryImage').value = '';
            document.getElementById('editModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            document.body.style.overflow = 'auto';
            editingStoryId = null;
            editImageData = null;
        }

        function previewEditImage() {
            const file = document.getElementById('editStoryImage').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    editImageData = e.target.result;
                    document.getElementById('editImagePreview').src = e.target.result;
                    document.getElementById('editImagePreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveEditStory() {
            const story = allStories.find(s => s.id === editingStoryId);
            if (!story) return;

            story.title = document.getElementById('editStoryTitle').value.trim();
            story.raceDate = document.getElementById('editRaceDate').value;
            story.driver = document.getElementById('editDriver').value.trim();
            story.raceLocation = document.getElementById('editRaceLocation').value.trim();
            story.content = document.getElementById('editStoryContent').value.trim();
            story.image = editImageData;

            saveStories();
            displayHome();
            closeEditModal();
        }
    </script>
</body>
</html>
